<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f4c">
<title>Markenkommunikation - Survey</title>

<style>
:root{
  --bg:#f2f7f5;
  --surface:#ffffff;
  --surface-soft:#f4fbf8;
  --ink:#101820;
  --muted:#627482;
  --line:#d5e3de;
  --brand:#17646a;
  --brand-dark:#0c3d42;
  --brand-soft:#dff3ee;
  --accent:#c27235;
  --accent-soft:#fff1df;
  --success:#147a4b;
  --danger:#b42318;
  --warn:#9a6700;
  --shadow:0 24px 70px rgba(12,61,66,.12);
  --radius:20px;
  --max:980px;
  --font:"Avenir Next","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100svh;
  font-family:var(--font);
  color:var(--ink);
  background:
    linear-gradient(120deg,rgba(23,100,106,.10) 0 1px,transparent 1px 34px),
    linear-gradient(30deg,rgba(194,114,53,.08) 0 1px,transparent 1px 42px),
    radial-gradient(circle at 18% 0%, rgba(23,100,106,.18), transparent 34%),
    radial-gradient(circle at 84% 8%, rgba(194,114,53,.14), transparent 30%),
    linear-gradient(180deg,#fbfefd 0%,var(--bg) 100%);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app-shell{width:min(100%,var(--max));margin:0 auto;padding:18px 14px 116px}
.topbar{
  margin:0 0 14px;
}
.topbar-inner{
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  padding:4px 2px 8px;
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.product-title{font-weight:900;letter-spacing:-.02em;font-size:clamp(16px,2.4vw,20px)}
.small{font-size:12px;color:var(--muted);font-weight:750}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  padding:8px 11px;
  background:var(--brand-soft);
  color:var(--brand-dark);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.progress-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:#24364a;font-size:13px;font-weight:800}
.progress-meta strong{color:#139789}
.progress-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.progress-track{height:8px;border-radius:999px;background:transparent;display:grid;grid-template-columns:repeat(var(--segments,7),1fr);gap:7px;overflow:visible}
.progress-segment{height:100%;border-radius:999px;background:#e4e8e8;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.progress-segment.done{background:linear-gradient(90deg,#10a89d,#4bc4ac);box-shadow:0 4px 10px rgba(16,168,157,.20)}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#39a391,var(--accent));border-radius:inherit;transition:width .32s cubic-bezier(.2,.8,.2,1)}
.card{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(213,227,222,.95);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:clamp(18px,4vw,30px);
  backdrop-filter:blur(16px);
}
.screen{display:none;animation:fade .28s cubic-bezier(.2,.8,.2,1)}
.screen.active{display:block}
@keyframes fade{from{opacity:.35;transform:translateY(10px) scale(.992)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0 0 12px;line-height:1.1;letter-spacing:-.035em}
h1{font-size:clamp(32px,7vw,58px)}
h2{font-size:clamp(24px,5vw,36px)}
h3{font-size:clamp(18px,3vw,24px)}
p{margin:0 0 14px;color:#374151;line-height:1.55;font-size:clamp(15px,2.5vw,18px)}
.muted{color:var(--muted)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{
  border:0;
  border-radius:999px;
  padding:13px 17px;
  font-size:14px;
  font-weight:950;
  min-height:46px;
  transition:transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#269780);color:#fff;box-shadow:0 14px 30px rgba(23,100,106,.22)}
.btn.secondary{background:#e8edf2;color:#253244}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--brand-dark)}
.btn.danger{background:#fee4e2;color:var(--danger)}
.btn:disabled{opacity:.48;cursor:not-allowed}
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:35;
  padding:12px max(14px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));
  background:rgba(242,247,245,.88);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(219,227,234,.95);
}
.nav-inner{width:min(100%,var(--max));margin:0 auto;display:flex;gap:10px}
.nav .primary{flex:1}
.notice{
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1e3a8a;
  border-radius:16px;
  padding:13px 14px;
  font-size:14px;
  line-height:1.45;
  margin:14px 0;
}
.notice.warn{border-color:#fed7aa;background:#fff7ed;color:#7c2d12}
.notice.success{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.stimulus-shell{display:grid;gap:16px}
.stimulus-card{
  border:1px solid var(--line);
  border-radius:26px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 20px 54px rgba(12,61,66,.10);
}
.stimulus-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  background:#fbfdff;
}
.brand-tag{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:950;color:var(--brand)}
.stimulus-body{padding:18px}
.stimulus-image{width:100%;display:block;max-height:56svh;object-fit:cover;background:#eef2f7}
.text-treatment{
  min-height:300px;
  display:grid;
  place-items:end start;
  padding:clamp(22px,5vw,38px);
  color:#fff;
  background:
    linear-gradient(180deg,rgba(12,61,66,.06),rgba(12,61,66,.88)),
    linear-gradient(135deg,#17646a,#3c9a8c 48%,#d7a56f);
}
.text-treatment-inner{max-width:560px}
.text-treatment .brand-tag{color:#dff7f5}
.text-treatment h3{font-size:clamp(30px,6vw,50px);color:#fff;margin-top:10px}
.text-treatment p{color:rgba(255,255,255,.88);font-size:clamp(16px,3vw,20px)}
.qgroup{display:grid;gap:18px;margin-top:18px}
.question{
  border:1px solid rgba(213,227,222,.9);
  border-radius:22px;
  padding:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(250,253,252,.9));
  box-shadow:0 12px 34px rgba(12,61,66,.06);
}
.question-head{display:block;margin-bottom:10px}
.qtitle{font-weight:900;line-height:1.34;margin-bottom:0;font-size:clamp(16px,2.7vw,20px)}
.likert-scale{
  position:relative;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
  margin:28px 0 0;
  padding-top:10px;
}
.likert-scale:before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:24px;
  height:4px;
  border-radius:999px;
  background:#111820;
}
.likert-option{
  position:relative;
  z-index:2;
  border:0;
  background:transparent;
  color:#12202c;
  min-width:0;
  padding:0 5px;
  display:grid;
  justify-items:center;
  gap:10px;
  cursor:pointer;
}
.likert-dot{
  width:30px;
  height:30px;
  border-radius:50%;
  border:5px solid #111820;
  background:#fff;
  box-shadow:0 8px 18px rgba(17,24,32,.08);
}
.likert-option.selected .likert-dot{
  background:#111820;
  box-shadow:0 12px 28px rgba(17,24,32,.18);
}
.likert-number{font-size:20px;font-weight:950;line-height:1}
.likert-label{font-size:12px;font-weight:800;line-height:1.2;text-align:center}
.slider-copy{font-size:13px;color:#111820;font-weight:900;margin-top:12px;min-height:18px;text-align:center}
.field,.select,.textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:13px 14px;
  color:var(--ink);
}
.textarea{min-height:112px;resize:vertical;line-height:1.45}
.choicegrid{display:grid;grid-template-columns:1fr;gap:10px}
.choice{
  border:1px solid var(--line);
  background:#fff;
  color:#1f2937;
  text-align:left;
  border-radius:14px;
  padding:13px 14px;
  font-weight:800;
}
.choice.selected{border-color:var(--brand);background:#e8f3f4;color:var(--brand-dark)}
.admin-shell{width:min(100%,1440px);margin:0 auto;padding:14px 12px 60px}
.admin-grid{display:grid;grid-template-columns:1fr;gap:14px}
.admin-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;padding:10px 13px;font-size:13px;font-weight:900}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{display:none}
.panel.active{display:block}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.metric{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px}
.metric-value{font-size:30px;line-height:1;font-weight:950;letter-spacing:-.04em;color:var(--brand-dark)}
.metric-label{font-size:12px;color:var(--muted);font-weight:850;margin-top:6px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f8fafc;color:#475569;font-weight:950;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.cms-layout{display:grid;grid-template-columns:1fr;gap:14px}
.builder-cms{
  display:grid;
  grid-template-columns:260px minmax(0,1fr) 360px;
  min-height:calc(100svh - 190px);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#f8fafb;
}
.builder-rail,.builder-inspector{
  background:#fbfcfd;
  border-color:var(--line);
}
.builder-rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.builder-inspector{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.builder-pane-head{
  min-height:52px;
  border-bottom:1px solid var(--line);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.builder-pane-title{font-size:12px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#64748b}
.builder-pane-sub{font-size:12px;color:#64748b;margin-top:2px}
.builder-list{padding:10px;display:grid;gap:6px;overflow:auto}
.builder-row{
  border:1px solid transparent;
  background:transparent;
  border-radius:12px;
  color:#273449;
  padding:9px 10px;
  text-align:left;
  display:grid;
  grid-template-columns:28px minmax(0,1fr);
  gap:9px;
  align-items:center;
  font-weight:800;
}
.builder-row:hover{border-color:var(--line);background:#fff}
.builder-row.active{border-color:#0f172a;background:#0f172a;color:#fff}
.builder-row-index{
  width:26px;
  height:26px;
  border-radius:9px;
  display:grid;
  place-items:center;
  border:1px solid currentColor;
  font-size:12px;
  opacity:.72;
}
.builder-row-main{min-width:0}
.builder-row-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.builder-row-meta{display:block;font-size:11px;font-weight:700;opacity:.66;margin-top:2px}
.builder-canvas{min-width:0;display:flex;flex-direction:column;background:#f3f6f7}
.builder-toolbar{
  min-height:52px;
  border-bottom:1px solid var(--line);
  background:#fff;
  padding:9px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.builder-toolbar-title{font-weight:950;letter-spacing:-.02em}
.builder-toolbar-meta{font-size:12px;color:#64748b;font-weight:750}
.builder-canvas-body{padding:18px;overflow:auto;display:grid;gap:14px;align-content:start}
.builder-preview-frame{
  width:min(100%,760px);
  margin:0 auto;
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 18px 45px rgba(15,23,42,.08);
}
.builder-preview-chrome{
  height:38px;
  border-bottom:1px solid var(--line);
  background:#fbfcfd;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 12px;
}
.builder-preview-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.builder-preview-inner{padding:16px}
.inline-edit{
  border-radius:8px;
  outline:1px solid transparent;
  transition:outline-color .16s ease, background .16s ease;
}
.inline-edit:hover{outline-color:#cbd5e1;background:rgba(248,250,252,.75)}
.inline-edit:focus{outline:2px solid #0f172a;background:#fff}
.inline-image-edit{
  position:relative;
  display:block;
  width:100%;
  border:0;
  padding:0;
  background:transparent;
  text-align:inherit;
  cursor:pointer;
}
.inline-image-edit:after{
  content:"Bild austauschen";
  position:absolute;
  right:12px;
  bottom:12px;
  border-radius:999px;
  background:#0f172a;
  color:#fff;
  padding:8px 10px;
  font-size:12px;
  font-weight:900;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .16s ease, transform .16s ease;
}
.inline-image-edit:hover:after,.inline-image-edit:focus:after{opacity:1;transform:none}
.inline-image-edit:focus{outline:2px solid #0f172a;outline-offset:3px}
.builder-inspector-body{padding:14px;overflow:auto;display:grid;gap:14px}
.builder-section{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  overflow:hidden;
}
.builder-section-head{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.builder-section-title{font-weight:950;font-size:14px}
.builder-section-body{padding:12px;display:grid;gap:12px}
.builder-mini-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.builder-mini-tab{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:8px 9px;
  font-size:12px;
  font-weight:900;
}
.builder-mini-tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
.builder-savebar{
  position:sticky;
  bottom:0;
  z-index:3;
  margin:-14px;
  margin-top:0;
  padding:12px 14px;
  border-top:1px solid var(--line);
  background:rgba(251,252,253,.94);
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.workspace-preview-stack{display:grid;gap:14px}
.survey-shell-preview{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,#ffffff,#f8fbfc);
  padding:18px;
  display:grid;
  gap:14px;
}
.survey-shell-panel{
  border:1px solid rgba(213,227,222,.9);
  border-radius:16px;
  background:#fff;
  padding:16px;
  display:grid;
  gap:10px;
}
.admin-tab-body{display:grid;gap:14px}
.admin-two-col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:14px}
.admin-side-stack{display:grid;gap:14px}
.editor-list{display:grid;gap:12px}
.editor-card{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:14px;
  display:grid;
  gap:12px;
}
.editor-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.editor-card-key{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.builder-quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.inline-note{font-size:12px;color:var(--muted);font-weight:800}
.confetti-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:80;
}
.confetti-piece{
  position:absolute;
  top:-10vh;
  width:12px;
  height:20px;
  border-radius:4px;
  opacity:.94;
  animation:confetti-fall linear forwards;
  will-change:transform,opacity;
}
@keyframes confetti-fall{
  0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}
  8%{opacity:1}
  100%{transform:translate3d(var(--drift,0px),120vh,0) rotate(var(--spin,540deg));opacity:0}
}
.form-grid{display:grid;grid-template-columns:1fr;gap:12px}
.field-label{display:grid;gap:6px;font-size:12px;font-weight:950;color:#475569;text-transform:uppercase;letter-spacing:.05em}
.status-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:800}
.status-dot{width:9px;height:9px;border-radius:999px;background:var(--warn)}
.status-dot.ok{background:var(--success)}
.status-dot.bad{background:var(--danger)}
.raw{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:16px;padding:14px;overflow:auto;max-height:420px;font-size:12px}
@media(min-width:760px){
  .app-shell{padding:22px 18px 118px}
  .stimulus-shell{grid-template-columns:minmax(0,1fr)}
  .choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cms-layout{grid-template-columns:320px minmax(0,1fr)}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field-label.full{grid-column:1/-1}
}
@media(max-width:980px){
  .admin-two-col{grid-template-columns:1fr}
}
@media(max-width:1100px){
  .builder-cms{grid-template-columns:240px minmax(0,1fr)}
  .builder-inspector{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media(max-width:760px){
  .builder-cms{grid-template-columns:1fr}
  .builder-rail,.builder-inspector{border-left:0;border-right:0}
  .builder-rail{border-bottom:1px solid var(--line)}
}
@media(max-width:420px){
  .toprow{align-items:flex-start}
  .progress-row{grid-template-columns:1fr}
  .progress-meta{justify-content:space-between}
  .likert-label{font-size:10px}
  .likert-number{font-size:16px}
  .likert-dot{width:24px;height:24px;border-width:4px}
  .nav-inner{flex-direction:column-reverse}
  .nav .btn{width:100%}
}
</style>

const memoryStore = {};

function getStorage(){
  try{
    const storage = window.localStorage;
    const probeKey = STORAGE_PREFIX + ":probe";
    storage.setItem(probeKey, "1");
    storage.removeItem(probeKey);
    return storage;
  }catch(error){
    return null;
  }
}

function storeGet(key, fallback){
  try{
    const storage = getStorage();
    const storageKey = STORAGE_PREFIX + ":" + key;
    const value = storage ? storage.getItem(storageKey) : memoryStore[storageKey];
    return value ? JSON.parse(value) : fallback;
  }catch(error){ return fallback; }
}

function storeSet(key, value){
  const storageKey = STORAGE_PREFIX + ":" + key;
  const serialized = JSON.stringify(value);
  const storage = getStorage();
  if (storage){
    storage.setItem(storageKey, serialized);
  } else {
    memoryStore[storageKey] = serialized;
  }
}

function uid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[char]));
}

function renderRichText(value){
  const escaped = escapeHtml(value ?? "");
  return escaped
    .replace(/\*\*(.+?)\*\*/gs, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

function launchConfetti(){
  const seed = `${appState.mode}:${appState.participant?.id || "anon"}:${appState.screenIndex}`;
  if (appState.confettiSeed === seed) return;
  appState.confettiSeed = seed;
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  const colors = ["#17646a","#39a391","#c27235","#f59e0b","#0f172a","#dff3ee"];
  for (let index = 0; index < 120; index += 1){
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[index % colors.length];
    piece.style.animationDuration = `${4.2 + Math.random() * 2.6}s`;
    piece.style.animationDelay = `${Math.random() * .4}s`;
    piece.style.setProperty("--drift", `${(Math.random() - .5) * 240}px`);
    piece.style.setProperty("--spin", `${360 + Math.random() * 900}deg`);
    piece.style.transform = `translate3d(0,0,0) rotate(${Math.random() * 180}deg)`;
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  window.setTimeout(() => layer.remove(), 7200);
}

    completionTitle: treatment?.completionTitle || DEFAULT_SETTINGS.completionTitle,
    completionText: treatment?.completionText || DEFAULT_SETTINGS.completionText
  };
}

const api = {
  async getConditions(){
    if (!supabaseClient) return CONDITIONS;
    const {data,error} = await supabaseClient.from("conditions").select("*").eq("is_active", true).order("sort_order");
    if (error) throw error;
    return data.map(row => ({
      id:row.id,label:row.label,experimentType:row.experiment_type,treatmentType:row.treatment_type,
      brandType:row.brand_type,aiDisclosure:row.ai_disclosure,sortOrder:row.sort_order
    }));
  },
  async getTreatment(conditionId, draft=false){
    if (!supabaseClient){
      const drafts = storeGet("drafts", DEFAULT_TREATMENTS);
      const published = storeGet("publishedTreatments", DEFAULT_TREATMENTS);
      return normalizeTreatment((draft ? drafts : published)[conditionId] || DEFAULT_TREATMENTS[conditionId]);
    }
    const table = draft ? "treatment_drafts" : "treatments";
    const {data,error} = await supabaseClient.from(table).select("*").eq("condition_id", conditionId).maybeSingle();
    if (error) throw error;
    return normalizeTreatment(data) || normalizeTreatment(DEFAULT_TREATMENTS[conditionId]);
  },
  async getAllDrafts(){
    if (!supabaseClient){
      const drafts = storeGet("drafts", DEFAULT_TREATMENTS);
      return Object.fromEntries(Object.entries(drafts).map(([key,value]) => [key, normalizeTreatment(value)]));
    }
    const {data,error} = await supabaseClient.from("treatment_drafts").select("*");
    if (error) throw error;
    const mapped = {};
    data.forEach(row => mapped[row.condition_id] = normalizeTreatment(row));
    CONDITIONS.forEach(condition => {
      if (!mapped[condition.id]) mapped[condition.id] = normalizeTreatment(DEFAULT_TREATMENTS[condition.id]);
    });
    return mapped;
  },
  async getSettings(draft=false){
    if (!supabaseClient){
      const key = draft ? "settingsDraft" : "settingsPublished";
      const fallback = draft ? storeGet("settingsPublished", DEFAULT_SETTINGS) : DEFAULT_SETTINGS;
      return normalizeSettings(storeGet(key, fallback));
    }
    const table = draft ? "app_settings_drafts" : "app_settings";
    const {data,error} = await supabaseClient.from(table).select("settings").eq("id", "public").maybeSingle();
    if (error && error.code !== "42P01") throw error;
    if (draft && !data){
      return await api.getSettings(false);
    }
    return normalizeSettings(data);
  },
  async saveSettings(settings){
    const next = normalizeSettings(settings);
    if (!supabaseClient){
      storeSet("settingsDraft", next);
      return next;
    }
    const {data,error} = await supabaseClient.rpc("save_app_settings_draft", {p_settings:next});
    if (error) throw error;
    return normalizeSettings(data);
  },
  async publishSettings(){
    if (!supabaseClient){
      const draft = storeGet("settingsDraft", storeGet("settingsPublished", DEFAULT_SETTINGS));
      storeSet("settingsPublished", draft);
      return normalizeSettings(draft);
    }
    const {data,error} = await supabaseClient.rpc("publish_app_settings_draft");
    if (error) throw error;
    return normalizeSettings(data);
  },
  async saveDraft(conditionId, treatment){
    if (!supabaseClient){
      const drafts = storeGet("drafts", DEFAULT_TREATMENTS);
      drafts[conditionId] = {...treatment, updatedAt:new Date().toISOString()};
      storeSet("drafts", drafts);
      return normalizeTreatment(drafts[conditionId]);
    }
    const payload = toDbTreatment(conditionId, treatment);
    const {data,error} = await supabaseClient.rpc("save_treatment_draft", {
      p_condition_id: payload.condition_id,
      p_brand_name: payload.brand_name,
      p_brand_type_label: payload.brand_type_label,
      p_headline: payload.headline,
      p_body: payload.body,
      p_ai_notice: payload.ai_notice,
      p_intro_chip: payload.intro_chip,
      p_intro_headline: payload.intro_headline,
      p_intro_body: payload.intro_body,
      p_intro_privacy: payload.intro_privacy,
      p_intro_notice: payload.intro_notice,
      p_stimulus_title: payload.stimulus_title,
      p_stimulus_text: payload.stimulus_text,
      p_completion_title: payload.completion_title,
      p_completion_text: payload.completion_text,
      p_image_path: payload.image_path || "",
      p_image_url: payload.image_url || ""
    });
    if (error) throw error;
    return normalizeTreatment(data);
  },
  async publishDraft(conditionId){
    if (!supabaseClient){
      const drafts = storeGet("drafts", DEFAULT_TREATMENTS);
      const published = storeGet("publishedTreatments", DEFAULT_TREATMENTS);
      published[conditionId] = {...drafts[conditionId], publishedAt:new Date().toISOString()};
      storeSet("publishedTreatments", published);
      return normalizeTreatment(published[conditionId]);
    }
    const {data,error} = await supabaseClient.rpc("publish_treatment_draft", {p_condition_id: conditionId});
    if (error) throw error;
    return normalizeTreatment(data);
  },
  async uploadAsset(conditionId, file){
    if (!file) return null;
    if (!supabaseClient){
      return new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({imageUrl:reader.result, imagePath:"local-preview/" + file.name});
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-");
    const {data:sessionData,error:sessionError} = await supabaseClient.auth.getSession();
    if (sessionError) throw sessionError;
    const userId = sessionData?.session?.user?.id;
    if (!userId) throw new Error("Bitte als Admin einloggen, um Bilder in Supabase zu speichern.");
    const path = `${userId}/${conditionId}/${Date.now()}-${safeName}`;
    const {error} = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, {upsert:true});
    if (error) throw error;
    const {data} = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return {imageUrl:data.publicUrl, imagePath:path};
  },
  async assignParticipant(anonymousId){
    if (!supabaseClient){
      const existing = storeGet("participant", null);
      if (existing && existing.anonymousId === anonymousId) return existing;
      const participants = storeGet("participants", []);
      const counts = CONDITIONS.map(condition => ({
        condition,
        count: participants.filter(row => row.conditionId === condition.id).length
      }));
      const min = Math.min(...counts.map(row => row.count));
      const candidates = counts.filter(row => row.count === min);
      const condition = candidates[Math.floor(Math.random() * candidates.length)].condition;
      const participant = {id:uid(), anonymousId, conditionId:condition.id, status:"started", startedAt:new Date().toISOString()};
      participants.push(participant);
      storeSet("participants", participants);
      storeSet("participant", participant);
      return participant;
    }
    const {data,error} = await supabaseClient.rpc("assign_participant", {
      p_anonymous_id: anonymousId,
      p_user_agent: navigator.userAgent
    });
    if (error) throw error;
    return {id:data.id, anonymousId:data.anonymous_id, conditionId:data.condition_id, status:data.status, startedAt:data.started_at};
  },
  async submitResponses(participant, condition, answers){
    const rows = buildResponseRows(participant, condition, answers);
    if (!supabaseClient){
      const all = storeGet("responses", []);
      const filtered = all.filter(row => row.participantId !== participant.id);
      storeSet("responses", filtered.concat(rows));
      const participants = storeGet("participants", []).map(row => row.id === participant.id ? {...row,status:"completed",completedAt:new Date().toISOString()} : row);
      storeSet("participants", participants);
      storeSet("participant", {...participant,status:"completed",completedAt:new Date().toISOString()});
      return;
    }
    const rpcRows = rows.map(row => ({
      question_key: row.questionKey,
      construct: row.construct,
      item_text: row.itemText,
      value: String(row.value),
      numeric_value: row.numericValue ?? null
    }));
    const {data,error} = await supabaseClient.rpc("complete_participant", {
      p_participant_id: participant.id,
      p_condition_id: condition.id,
      p_responses: rpcRows
    });
    if (error) throw error;
    appState.participant = {
      id:data.id,
      anonymousId:data.anonymous_id,
      conditionId:data.condition_id,
      status:data.status,
      startedAt:data.started_at,
      completedAt:data.completed_at
    };
  },
  async submitRaffleEntry(participant, email){
    const normalizedEmail = String(email || "").trim();
    if (!normalizedEmail) return;
    if (!supabaseClient){
      const entries = storeGet("raffleEntries", []);
      const next = entries.filter(row => row.participantId !== participant.id);
      next.push({participantId:participant.id, conditionId:participant.conditionId, email:normalizedEmail, createdAt:new Date().toISOString()});
      storeSet("raffleEntries", next);
      return;
    }
    const {error} = await supabaseClient.from("raffle_entries").insert({
      participant_id: participant.id,
      condition_id: participant.conditionId,
      email: normalizedEmail
    });
    if (error && error.code === "23505") return;
    if (error) throw error;
  },
  async signIn(email,password){
    if (!supabaseClient){
      appState.adminSession = {user:{email:email || "local-admin@example.test"}};
      return appState.adminSession;
    }
    const {data,error} = await supabaseClient.auth.signInWithPassword({email,password});
    if (error) throw error;
    return data.session;
  },
  async signOut(){
    if (supabaseClient) await supabaseClient.auth.signOut();
    appState.adminSession = null;
  },
  async getSession(){
    if (!supabaseClient) return appState.adminSession;
    const {data} = await supabaseClient.auth.getSession();
    return data.session;
  },
  async getAdminData(){
    if (!supabaseClient){
      return {
        participants: storeGet("participants", []),
        responses: storeGet("responses", []),
        raffleEntries: storeGet("raffleEntries", [])
      };
    }
    const {data:participants,error:pError} = await supabaseClient.from("participants").select("*").order("started_at", {ascending:false});
    if (pError) throw pError;
    const {data:responses,error:rError} = await supabaseClient.from("responses").select("*").order("created_at", {ascending:false});
    if (rError) throw rError;
    const {data:raffleEntries,error:eError} = await supabaseClient.from("raffle_entries").select("*").order("created_at", {ascending:false});
    if (eError && eError.code !== "42P01") throw eError;
    return {
      participants: participants.map(row => ({
        id:row.id, anonymousId:row.anonymous_id, conditionId:row.condition_id, status:row.status,
        startedAt:row.started_at, completedAt:row.completed_at
      })),
      responses: responses.map(row => ({
        id:row.id, participantId:row.participant_id, conditionId:row.condition_id,
        questionKey:row.question_key, construct:row.construct, itemText:row.item_text,
        value:row.value, numericValue:row.numeric_value, createdAt:row.created_at
      })),
      raffleEntries: (raffleEntries || []).map(row => ({
        id:row.id,
        participantId:row.participant_id,
        conditionId:row.condition_id,
        email:row.email,
        createdAt:row.created_at
      }))
    };
  }
};

function conditionById(id){
  return CONDITIONS.find(condition => condition.id === id) || CONDITIONS[0];
}

function getAnonymousId(){
  const storage = getStorage();
  const storageKey = STORAGE_PREFIX + ":anonymousId";
  let anonymousId = storage ? storage.getItem(storageKey) : memoryStore[storageKey];
  if (!anonymousId){
    anonymousId = uid();
    if (storage){
      storage.setItem(storageKey, anonymousId);
    } else {
      memoryStore[storageKey] = anonymousId;
    }
  }
  return anonymousId;
}

  items.push(["ai_detected","Manipulation Check KI","Ich hatte den Eindruck, dass bei den gezeigten Inhalten künstliche Intelligenz eingesetzt wurde."]);

function likertTextForValue(rawValue){
  const value = Number(rawValue);
  return {
    1:"Stimme gar nicht zu",
    2:"Stimme eher nicht zu",
    3:"Teils / teils",
    4:"Stimme eher zu",
    5:"Stimme voll zu"
  }[value] || String(rawValue ?? "");
}

function isLikertQuestionKey(key){
  return getQuestionGroups().some(group => group.items.some(item => item[0] === key)) || key === "ai_detected";
}

function responseValueForKey(key, rawValue){
  if (isLikertQuestionKey(key)) return likertTextForValue(rawValue);
  return rawValue ?? "";
}

function responseNumericValueForKey(key, rawValue){
  if (isLikertQuestionKey(key)) return Number.isFinite(Number(rawValue)) ? Number(rawValue) : null;
  return Number.isFinite(Number(rawValue)) ? Number(rawValue) : null;
}

function buildResponseRows(participant, condition, answers){
  return allQuestionItems().map(([key,construct,itemText]) => ({
    participantId:participant.id,
    conditionId:condition.id,
    questionKey:key,
    construct,
    itemText,
    value:responseValueForKey(key, answers[key]),
    numericValue:responseNumericValueForKey(key, answers[key]),
    createdAt:new Date().toISOString()
  }));
}

function isLikertScreen(index){
  return index >= 2 && index <= 6;
}

function currentRequiredKeys(){
  const index = appState.screenIndex;
  const questionGroups = getQuestionGroups();
  if (index >= 2 && index <= 5) return questionGroups[index - 2].items.map(item => item[0]);
  if (index === 6) return ["ai_detected"];
  if (index === 7) return ["age","gender","education","ai_usage"];
  return [];
}

function hasValidRaffleEmail(){
  const email = String(appState.answers.raffle_email || "").trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function getQuestionGroups(){
  return Array.isArray(appState.settings.questionGroups) && appState.settings.questionGroups.length
    ? appState.settings.questionGroups
    : QUESTION_GROUPS;
}

function canGoNext(){
  const required = currentRequiredKeys();

}

function renderTopbar(title, step, total){
  const safeTotal = Number.isFinite(Number(total)) && Number(total) > 0 ? Number(total) : 1;
  const safeStep = Number.isFinite(Number(step)) && Number(step) > 0 ? Math.min(Number(step), safeTotal) : 1;
  const computedPct = Math.round((safeStep / safeTotal) * 100);
  const pct = Number.isFinite(computedPct) ? computedPct : 0;
  const remaining = Math.max(safeTotal - safeStep, 0);
  const segmentCount = Math.max(safeTotal - 1, 1);
  const doneSegments = Math.min(Math.max(safeStep - 1, 0), segmentCount);
  const displayTitle = String(title || "").toLowerCase().includes("ki in markenkommunikation") ? "Markenkommunikation" : title;
  return `
    <div class="topbar">
      <div class="topbar-inner">
        <div class="toprow">
          <div>
            <div class="product-title">${escapeHtml(displayTitle)}</div>
          </div>
          <div class="progress-meta">
            <span>${remaining ? `Noch ${remaining} Fragen bis zum Ziel!` : "Fast geschafft!"}</span>
          </div>
        </div>
        <div class="progress-row">
          <div class="progress-track" style="--segments:${segmentCount}">
            ${Array.from({length:segmentCount}, (_,index) => `<span class="progress-segment ${index < doneSegments ? "done" : ""}"></span>`).join("")}
          </div>
          <div class="progress-meta"><strong>${pct} %</strong></div>
        </div>
      </div>
    </div>
  `;
}

function computeMetrics(){
  const participants = appState.adminRows;
  const responses = appState.adminResponses;
  const completed = participants.filter(row => row.status === "completed").length;
  const counts = CONDITIONS.map(condition => ({
    condition,
    count: participants.filter(row => row.conditionId === condition.id).length,
    completed: participants.filter(row => row.conditionId === condition.id && row.status === "completed").length
  }));
  const constructMeans = {};
  responses.forEach(row => {
    const numeric = Number(row.numericValue ?? row.numeric_value ?? row.value);
    if (!Number.isFinite(numeric)) return;
    if (!["Markenvertrauen","Markeninnovativität","Kaufabsicht","Markenbewertung","Manipulation Check KI"].includes(row.construct)) return;
    if (!constructMeans[row.construct]) constructMeans[row.construct] = [];
    constructMeans[row.construct].push(numeric);
  });
  return {participants, responses, completed, counts, constructMeans};
}

function mean(values){
  if (!values.length) return "-";
  return (values.reduce((sum,value) => sum + value, 0) / values.length).toFixed(2);
}

    appState.settings = await api.getSettings(false);
    const anonymousId = getAnonymousId();
    const participant = await api.assignParticipant(anonymousId);
    const condition = conditionById(participant.conditionId);
    const treatment = await api.getTreatment(condition.id, false);
    appState.mode = "survey";
    appState.participant = participant;
    appState.condition = condition;
    appState.treatment = treatment;
    appState.answers = storeGet("answers:" + participant.id, {});
    renderSurvey();
  }catch(error){
    root.innerHTML = `<main class="app-shell"><div class="card"><h1>Die Survey konnte nicht geladen werden.</h1><p>${escapeHtml(error.message || error)}</p></div></main>`;
  }
}

async function initAdmin(){
  renderLoading("Admin wird geladen");
  try{
    appState.mode = "admin";
    appState.adminSession = await api.getSession();
    if (!appState.adminSession){
      renderAdminLogin();
      return;
    }
    appState.settings = await api.getSettings(true);
    appState.drafts = await api.getAllDrafts();
    const data = await api.getAdminData();
    appState.adminRows = data.participants;
    appState.adminResponses = data.responses;
    appState.adminRaffleEntries = data.raffleEntries || [];
    renderAdmin();
  }catch(error){
    appState.message = error.message || String(error);
    renderAdminLogin();
  }
}

async function startAdminSurveyPreview(conditionId){
  const condition = conditionById(conditionId);
  appState.adminReturnTab = appState.adminTab || "preview";
  appState.settings = await api.getSettings(true);
  if (!Object.keys(appState.drafts || {}).length){
    appState.drafts = await api.getAllDrafts();
  }
  const treatment = appState.drafts[condition.id] || await api.getTreatment(condition.id, true);
  appState.mode = "adminPreview";
  appState.screenIndex = 0;
  appState.participant = {id:"admin-preview-" + condition.id, anonymousId:"admin-preview", conditionId:condition.id, status:"preview"};
  appState.condition = condition;
  appState.treatment = treatment;
  appState.answers = {};
  appState.message = "";
  renderSurvey();
  window.scrollTo(0,0);
}

async function exitAdminSurveyPreview(){
  appState.mode = "admin";
  appState.screenIndex = 0;
  appState.answers = {};
  appState.participant = null;
  appState.condition = null;
  appState.treatment = null;
  appState.adminTab = appState.adminReturnTab || "preview";
  await initAdmin();
}

function initPreviewFromHash(){
  const id = new URLSearchParams(location.hash.replace(/^#/, "")).get("preview");
  if (id && conditionById(id)){
    appState.previewConditionId = id;
    appState.cmsConditionId = id;
    appState.adminTab = "analytics";
  }
}

async function route(){
  initPreviewFromHash();
  const pathLooksAdmin = location.pathname.endsWith("/admin") || location.pathname.includes("finale_survey_app.html/admin");
  if (pathLooksAdmin || location.hash.startsWith("#admin") || location.hash.includes("preview=")){
    await initAdmin();
  }else{
    await initSurvey();
  }
}

async function nextSurvey(){
  if (appState.mode === "adminPreview" && appState.screenIndex === 10){
    await exitAdminSurveyPreview();
    return;
  }
  if (appState.screenIndex < 7){
    appState.message = "";
    appState.screenIndex += 1;
    renderSurvey();
    window.scrollTo(0,0);
    return;
  }
  if (appState.screenIndex === 7){
    if (appState.mode === "adminPreview"){
      appState.message = "Admin-Preview abgeschlossen. Es wurde nichts gespeichert.";
      appState.screenIndex = 8;
      renderSurvey();
      window.scrollTo(0,0);
      return;
    }
    appState.submitting = true;
    appState.message = "Antworten werden gespeichert ...";
    renderSurvey();
    try{
      await api.submitResponses(appState.participant, appState.condition, appState.answers);
      appState.message = "Gespeichert.";
      appState.screenIndex = 8;
    }catch(error){
      appState.message = "Speichern fehlgeschlagen: " + (error.message || error);
    }finally{
      appState.submitting = false;
      renderSurvey();
    }
    return;
  }
  if (appState.screenIndex === 8){
    appState.message = "";
    appState.screenIndex = 9;
    renderSurvey();
    window.scrollTo(0,0);
    return;
  }
  if (appState.screenIndex === 9){
    if (appState.mode === "adminPreview"){
      appState.message = "Admin-Preview abgeschlossen. Es wurde nichts gespeichert.";
      appState.screenIndex = 10;
      renderSurvey();
      window.scrollTo(0,0);
      return;
    }
    appState.submitting = true;
    appState.message = "E-Mail wird gespeichert ...";
    renderSurvey();
    try{
      await api.submitRaffleEntry(appState.participant, appState.answers.raffle_email);
      appState.message = "Teilnahme am Gewinnspiel gespeichert.";
      appState.screenIndex = 10;
    }catch(error){
      appState.message = "Speichern fehlgeschlagen: " + (error.message || error);
    }finally{
      appState.submitting = false;
      renderSurvey();
    }
  }
}

function previousSurvey(){
  if (appState.screenIndex > 0){
    appState.screenIndex -= 1;
    renderSurvey();
    window.scrollTo(0,0);
  }
}

function getCmsDraftFromForm(){
  const current = appState.drafts[appState.cmsConditionId] || normalizeTreatment(DEFAULT_TREATMENTS[appState.cmsConditionId]);
  const next = {...current};
  document.querySelectorAll("[data-cms-field]").forEach(field => {
    next[field.dataset.cmsField] = field.value;
  });
  return next;
}

function syncCmsDraftField(field, value){
  const current = appState.drafts[appState.cmsConditionId] || normalizeTreatment(DEFAULT_TREATMENTS[appState.cmsConditionId]);
  const next = {...current, [field]:value};
  appState.drafts[appState.cmsConditionId] = next;
  document.querySelectorAll(`[data-cms-field="${field}"]`).forEach(input => {
    if (input.value !== value) input.value = value;
  });
  document.querySelectorAll(`[data-inline-field="${field}"]`).forEach(node => {
    if (document.activeElement !== node && node.innerText !== value) node.innerText = value;
  });
  if (field === "imageUrl"){
    document.querySelectorAll(".inline-image-edit img, .builder-preview-inner .stimulus-image").forEach(img => {
      img.src = value || LOCAL_ASSET;
    });
  }
}

function syncSettingField(field, value){
  appState.settings = {...appState.settings, [field]:value};
  document.querySelectorAll(`[data-setting-field="${field}"]`).forEach(input => {
    if (input.value !== value) input.value = value;
  });
  document.querySelectorAll(`[data-setting-inline="${field}"]`).forEach(node => {
    if (document.activeElement !== node && node.innerText !== value) node.innerText = value;
  });
}

function fileToDataUrl(file){
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function fileToCompressedDataUrl(file, maxWidth=1800, quality=.88){
  const raw = await fileToDataUrl(file);
  if (!file.type.startsWith("image/")) return raw;
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const scale = Math.min(1, maxWidth / image.naturalWidth);
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(image, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    image.onerror = () => resolve(raw);
    image.src = raw;
  });
}

async function previewSelectedAsset(file){
  if (!file) return;
  appState.pendingAssets[appState.cmsConditionId] = file;
  const imageUrl = await fileToCompressedDataUrl(file, 1800, .88);
  syncCmsDraftField("imageUrl", imageUrl);
  const current = appState.drafts[appState.cmsConditionId] || normalizeTreatment(DEFAULT_TREATMENTS[appState.cmsConditionId]);
  appState.drafts[appState.cmsConditionId] = {...current, imageUrl, imagePath:"pending-upload/" + file.name};
  appState.message = "Bild ausgewählt. Bitte Draft speichern oder veröffentlichen.";
}

async function saveCmsDraft(silent=false){
  const file = appState.pendingAssets[appState.cmsConditionId] || document.getElementById("assetUpload")?.files?.[0];
  const draft = getCmsDraftFromForm();
  if (file){
    const asset = await api.uploadAsset(appState.cmsConditionId, file);
    draft.imageUrl = asset.imageUrl;
    draft.imagePath = asset.imagePath;
  }
  const saved = await api.saveDraft(appState.cmsConditionId, draft);
  appState.drafts[appState.cmsConditionId] = saved;
  delete appState.pendingAssets[appState.cmsConditionId];
  appState.message = file ? "Bild in Supabase hochgeladen und Draft gespeichert." : "Entwurf in Supabase gespeichert.";
  if (!silent) renderAdmin();
}

async function saveSettingsDraft(silent=false){
  const next = {publicTitle: appState.settings.publicTitle};
  document.querySelectorAll("[data-setting-field]").forEach(field => {
    next[field.dataset.settingField] = field.value;
  });
  const groups = JSON.parse(JSON.stringify(getQuestionGroups()));
  document.querySelectorAll("[data-q-field]").forEach(field => {
    const groupIndex = Number(field.dataset.groupIndex);
    const itemIndex = field.dataset.itemIndex === undefined ? null : Number(field.dataset.itemIndex);
    const qField = field.dataset.qField;
    if (!groups[groupIndex]) return;
    if (itemIndex === null){
      groups[groupIndex][qField] = field.value;
      return;
    }
    if (!groups[groupIndex].items[itemIndex]) return;
    if (qField === "construct") groups[groupIndex].items[itemIndex][1] = field.value;
    if (qField === "label") groups[groupIndex].items[itemIndex][2] = field.value;
  });
  next.questionGroups = groups;
  appState.settings = await api.saveSettings(next);
  appState.message = "Survey-Texte als Draft gespeichert.";
  if (!silent) renderAdmin();
}

async function publishSettingsDraft(){
  await saveSettingsDraft(true);
  appState.settings = await api.publishSettings();
  appState.message = "Survey-Texte veröffentlicht.";
  renderAdmin();
}

async function saveBuilderWorkspace(){
  await saveSettingsDraft(true);
  await saveCmsDraft(true);
  appState.message = "Builder-Draft gespeichert.";
  renderAdmin();
}

async function publishBuilderWorkspace(){
  await saveSettingsDraft(true);
  await saveCmsDraft(true);
  const publishedTreatment = await api.publishDraft(appState.cmsConditionId);
  appState.drafts[appState.cmsConditionId] = publishedTreatment;
  appState.settings = await api.publishSettings();
  appState.message = "Builder veröffentlicht. Texte und Treatment sind live.";
  renderAdmin();
}

function exportCsv(){
  const participants = appState.adminRows;
  const responses = appState.adminResponses;
  const questionKeys = allQuestionItems().map(item => item[0]);
  const headers = ["participant_id","anonymous_id","condition_id","condition_label","status","started_at","completed_at",...questionKeys];
  const lines = [headers];
  participants.forEach(participant => {
    const byKey = Object.fromEntries(responses.filter(row => row.participantId === participant.id).map(row => [row.questionKey, row.value]));
    lines.push([
      participant.id,
      participant.anonymousId || "",
      participant.conditionId,
      conditionById(participant.conditionId).label,
      participant.status,
      participant.startedAt || "",
      participant.completedAt || "",
      ...questionKeys.map(key => byKey[key] || "")
    ]);
  });
  const csv = lines.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "survey_export.csv";
  link.click();
  URL.revokeObjectURL(url);
}

document.addEventListener("click", async event => {
  const inlineImage = event.target.closest("[data-inline-image]");
  if (inlineImage){
    document.getElementById("assetUpload")?.click();
    return;
  }

  if (event.target.closest("[data-admin-preview-exit]")){
    await exitAdminSurveyPreview();
    return;
  }

  const startPreview = event.target.closest("[data-start-admin-survey-preview]");
  if (startPreview){
    await startAdminSurveyPreview(startPreview.dataset.startAdminSurveyPreview);
    return;
  }

  const previewStep = event.target.closest("[data-admin-preview-step]");
  if (previewStep){
    const selectedId = appState.previewConditionId || appState.cmsConditionId || CONDITIONS[0].id;
    const currentIndex = CONDITIONS.findIndex(condition => condition.id === selectedId);
    const delta = previewStep.dataset.adminPreviewStep === "next" ? 1 : -1;
    const nextIndex = (currentIndex + delta + CONDITIONS.length) % CONDITIONS.length;
    appState.previewConditionId = CONDITIONS[nextIndex].id;
    appState.cmsConditionId = appState.previewConditionId;
    renderAdmin();
    return;
  }

  const nav = event.target.closest("[data-nav]");
  if (nav){
    if (nav.dataset.nav === "next") await nextSurvey();
    if (nav.dataset.nav === "back") previousSurvey();
    return;
  }

  if (event.target.closest("[data-skip-raffle]")){
    appState.message = "Survey abgeschlossen.";
    appState.screenIndex = 10;
    renderSurvey();
    window.scrollTo(0,0);
    return;
  }

  const answer = event.target.closest("[data-answer]");
  if (answer){
    appState.answers[answer.dataset.answer] = answer.dataset.value;
    if (appState.participant && appState.mode !== "adminPreview") storeSet("answers:" + appState.participant.id, appState.answers);
    renderSurvey();
    return;
  }

  const sliderPick = event.target.closest("[data-slider-pick]");
  if (sliderPick){
    const key = sliderPick.dataset.sliderPick;
    appState.answers[key] = sliderPick.dataset.value;
    if (appState.participant && appState.mode !== "adminPreview") storeSet("answers:" + appState.participant.id, appState.answers);
    renderSurvey();
    return;
  }

  const login = event.target.closest("#adminLoginBtn");
  if (login){
    appState.message = "";
    try{
      const email = document.getElementById("adminEmail").value;
      const password = document.getElementById("adminPassword").value;
      await api.signIn(email, password);
      await initAdmin();
    }catch(error){
      appState.message = error.message || String(error);
      renderAdminLogin();
    }
    return;
  }

  const adminTab = event.target.closest("[data-admin-tab]");
  if (adminTab){
    appState.adminTab = adminTab.dataset.adminTab;
    appState.message = "";
    renderAdmin();
    return;
  }

  const cmsCondition = event.target.closest("[data-cms-condition]");
  if (cmsCondition){
    appState.cmsConditionId = cmsCondition.dataset.cmsCondition;
    appState.previewConditionId = appState.cmsConditionId;
    appState.message = "";
    renderAdmin();
    return;
  }

  if (event.target.closest("#saveBuilderDraft")){
    appState.message = "";
    try{ await saveBuilderWorkspace(); }
    catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#publishBuilderDraft")){
    appState.message = "";
    try{ await publishBuilderWorkspace(); }
    catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#saveConditionTextsDraft")){
    try{ await saveCmsDraft(); }
    catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#publishConditionTextsDraft")){
    try{
      await saveCmsDraft(true);
      const published = await api.publishDraft(appState.cmsConditionId);
      appState.drafts[appState.cmsConditionId] = published;
      appState.message = "Condition-Texte veröffentlicht.";
      renderAdmin();
    }catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#saveSettingsDraft")){
    try{ await saveSettingsDraft(); }
    catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#publishSettingsDraft")){
    try{ await publishSettingsDraft(); }
    catch(error){ appState.message = error.message || String(error); renderAdmin(); }
    return;
  }

  if (event.target.closest("#refreshAdmin")){
    await initAdmin();
    return;
  }

  if (event.target.closest("#adminLogout")){
    await api.signOut();
    appState.message = "";
    renderAdminLogin();
    return;
  }

  if (event.target.closest("#exportCsv")){
    exportCsv();
  }
});

document.addEventListener("input", event => {
  const inlineField = event.target.closest("[data-inline-field]");
  if (inlineField){
    syncCmsDraftField(inlineField.dataset.inlineField, inlineField.innerText.trim());
    return;
  }

  const cmsField = event.target.closest("[data-cms-field]");
  if (cmsField){
    syncCmsDraftField(cmsField.dataset.cmsField, cmsField.value);
    return;
  }

  const settingField = event.target.closest("[data-setting-field]");
  if (settingField){
    syncSettingField(settingField.dataset.settingField, settingField.value);
    return;
  }

  const slider = event.target.closest("[data-slider-answer]");
  if (slider){
    const key = slider.dataset.sliderAnswer;
    appState.answers[key] = slider.value;
    if (appState.participant && appState.mode !== "adminPreview") storeSet("answers:" + appState.participant.id, appState.answers);
    const valueNode = document.querySelector(`[data-slider-value="${key}"]`);
    const copyNode = document.querySelector(`[data-slider-copy="${key}"]`);
    const likertNode = slider.closest(".likert");
    if (likertNode) likertNode.style.setProperty("--pos", `${((Number(slider.value) - 1) / 4) * 100}%`);
    if (valueNode){
      valueNode.textContent = slider.value;
      valueNode.classList.remove("is-empty");
    }
    if (copyNode) copyNode.textContent = ["","Gar nicht","Eher nicht","Teils / teils","Eher ja","Voll und ganz"][Number(slider.value)];
    const nextButton = document.querySelector('[data-nav="next"]');
    if (nextButton) nextButton.disabled = !canGoNext();
    return;
  }

  const field = event.target.closest("[data-input]");
  if (field){
    appState.answers[field.dataset.input] = field.value;
    if (appState.participant && appState.mode !== "adminPreview") storeSet("answers:" + appState.participant.id, appState.answers);
    updateNextButtonState();
  }
});

document.addEventListener("keydown", event => {
  const inlineField = event.target.closest("[data-inline-field]");
  const inlineSetting = event.target.closest("[data-setting-inline]");
  const target = inlineField || inlineSetting;
  if (!target) return;
  const allowMultiline = inlineField && inlineField.dataset.inlineField === "body";
  if (event.key === "Enter" && !allowMultiline){
    event.preventDefault();
    target.blur();
  }
});

document.addEventListener("change", event => {
  if (event.target.id === "assetUpload"){
    previewSelectedAsset(event.target.files?.[0]);
  }
});

window.addEventListener("hashchange", route);
route();
