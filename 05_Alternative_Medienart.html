<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alternative Medienart</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#245f73;--brand2:#dfeef0;--danger:#b91c1c;--radius:24px;--max:760px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;background:radial-gradient(circle at top,#eff8f8 0,#f6f7fb 46%,#eef2f7 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{width:min(100%,var(--max));margin:0 auto;min-height:100svh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.88);backdrop-filter:blur(16px);padding:14px clamp(14px,4vw,28px) 10px;border-bottom:1px solid rgba(229,231,235,.8)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.backlink{color:var(--brand);text-decoration:none;font-weight:900;font-size:14px}.steptext{font-size:12px;color:var(--muted);font-weight:800}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--brand);width:0%;transition:.25s}.screen{display:none;padding:clamp(18px,5vw,36px);flex:1}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,5vw,30px);box-shadow:0 18px 50px rgba(15,23,42,.08)}h1{font-size:clamp(30px,8vw,54px);line-height:1.02;letter-spacing:-.05em;margin:0 0 14px}h2{font-size:clamp(23px,6vw,36px);line-height:1.08;letter-spacing:-.04em;margin:0 0 12px}p{font-size:clamp(15px,3.8vw,18px);line-height:1.5;color:#374151}.muted{color:var(--muted)}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--brand2);color:#174b5b;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}.notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:18px;padding:13px 14px;font-size:14px;line-height:1.45;margin:14px 0}.treatment{border:1px solid var(--line);border-radius:22px;background:#fbfbfc;padding:14px;margin:14px 0 18px}.ad{background:#fff;border-radius:20px;border:1px solid #eceff3;overflow:hidden}.adimg{width:100%;display:block;max-height:48svh;object-fit:cover}.adbody{padding:18px}.brandname{font-size:12px;font-weight:950;color:#245f73;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.headline{font-size:clamp(24px,7vw,38px);line-height:1;letter-spacing:-.04em;font-weight:950;margin-bottom:10px}.copy{color:#4b5563;line-height:1.48;font-size:clamp(15px,3.8vw,17px)}.qblock{margin:18px 0;padding-top:4px}.qtitle{font-weight:850;font-size:clamp(15px,4vw,18px);line-height:1.35;margin-bottom:12px}.scale{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.scale input{width:100%;accent-color:var(--brand)}.value{min-width:38px;height:38px;border-radius:14px;background:#eef2f7;display:grid;place-items:center;font-weight:950}.labels{display:flex;justify-content:space-between;color:#6b7280;font-size:11px;margin-top:4px;gap:10px}.choicegrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 15px;text-align:left;font-weight:800;color:#1f2937}.choice.selected{border-color:var(--brand);background:#e8f3f4;color:#123f4c}.field{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;background:#fff}.nav{position:sticky;bottom:0;background:rgba(246,247,251,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(229,231,235,.9);padding:12px clamp(14px,4vw,28px) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.btn{border:0;border-radius:999px;padding:15px 18px;font-weight:950;font-size:15px}.btn.secondary{background:#e5e7eb;color:#374151}.btn.primary{background:var(--brand);color:#fff;flex:1}.btn:disabled{opacity:.45}.summary{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:18px;padding:16px;font-size:13px;overflow:auto;max-height:42svh}@media(min-width:720px){.choicegrid{grid-template-columns:repeat(2,1fr)}.screen{padding-top:34px}.adbody{padding:24px}.nav{border-radius:24px 24px 0 0}}@media(max-width:370px){.nav{flex-direction:column-reverse}.btn{width:100%}.adimg{max-height:40svh}}
.index-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#155eaa;background:#eef5ff;border:1px solid #bfdbfe;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850;margin-bottom:10px}.index-link:active{transform:translateY(1px)}@media (min-width:760px){.index-link{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><a class="backlink" href="index.html">Zur Übersicht</a><div class="steptext" id="stepText"></div></div><div class="bar"><span id="progress"></span></div></header>
<main id="screens"></main>
<nav class="nav"><button class="btn secondary" id="prevBtn">Zurück</button><button class="btn primary" id="nextBtn">Weiter</button></nav>
</div>
<script>
const image='aurelis_premium.png';
const textAsset={type:'Text',html:`<div class="ad"><div class="adbody"><div class="brandname">Aurelis</div><div class="headline">Mehr Ruhe für deine Haut.</div><div class="copy">Aurelis verbindet hochwertige Formulierungen mit einer Pflegeroutine, die sich bewusst und angenehm anfühlt. Für Haut, die gepflegter, ausgeglichener und frischer wirken soll.</div></div></div>`};
const imageAsset={type:'Bild',html:`<div class="ad"><img class="adimg" src="${image}" alt="Aurelis Premium Treatment"><div class="adbody"><div class="brandname">Aurelis</div><div class="copy">Bildmotiv der Markenkommunikation.</div></div></div>`};
let order=Math.random()<.5?[textAsset,imageAsset]:[imageAsset,textAsset];
let aiMode=false;const answers={condition:'alternative_medienart',ai_hint:false,order:order.map(x=>x.type)};
const likertLabels='<div class="labels"><span>1 Stimme gar nicht zu</span><span>5 Stimme voll zu</span></div>';
const evalItems=[['trust_reliable','Diese Marke wirkt auf mich verlässlich.'],['trust','Ich habe Vertrauen in diese Marke.'],['trust_promise','Diese Marke hält, was sie verspricht.'],['trust_intentions','Diese Marke scheint die Erwartungen ihrer Kund:innen ernst zu nehmen.'],['innovative','Diese Marke wirkt innovativ.'],['creative','Diese Marke wirkt kreativ.'],['modern','Diese Marke wirkt modern und zukunftsorientiert.'],['solutions','Ich traue dieser Marke zu, neue und relevante Lösungen hervorzubringen.'],['purchase','Nach diesem Eindruck könnte ich mir vorstellen, Produkte dieser Marke zu kaufen.'],['consider','Die Wahrscheinlichkeit, dass ich diese Marke in Betracht ziehen würde, ist hoch.'],['choose','Ich würde diese Marke eher auswählen als vergleichbare Alternativen.'],['positive','Insgesamt hinterlässt diese Marke einen positiven Eindruck bei mir.'],['fit','Die gezeigte Kommunikation passt gut zu dieser Marke.'],['quality','Die Marke wirkt hochwertig.']];
const blocks=[];
function treatment(asset){return `<div class="treatment"><div class="pill">Treatment sichtbar: ${asset.type}</div>${asset.html}</div>`}
function slider(name,label){return `<div class="qblock"><div class="qtitle">${label}</div><div class="scale"><input type="range" min="1" max="5" value="3" step="1" data-name="${name}"><div class="value" data-val="${name}">3</div></div>${likertLabels}</div>`}
function choices(name,opts){return `<div class="choicegrid" data-choice="${name}">${opts.map(o=>`<button class="choice" type="button" data-value="${o}">${o}</button>`).join('')}</div>`}
function evalScreen(asset,idx){return `<section class="screen"><div class="card"><div class="pill">Bewertung Stimulus ${idx+1}</div><h2>${asset.type}-Asset bewerten</h2><p class="muted">Bitte bewerte die folgenden Aussagen spontan nach deinem Eindruck.</p>${treatment(asset)}${evalItems.map(([k,l])=>slider(`s${idx+1}_${asset.type}_${k}`,l)).join('')}</div></section>`}
blocks.push(`<section class="screen active"><div class="card"><div class="pill">Alternative Langversion</div><h1>Medienart: Text vs. Bild</h1><p>Du siehst zwei Beispiele aus der Markenkommunikation derselben fiktiven Premiummarke. Bitte betrachte die Inhalte aufmerksam und bewerte sie spontan.</p><div class="notice"><strong>Prototyp-Hinweis:</strong> In dieser Alternative kannst du den KI-Hinweis ein- oder ausschalten. In der echten Erhebung würde das zufällig getrennt ausgespielt.</div><div class="choicegrid" data-choice="ai_hint"><button class="choice selected" type="button" data-value="Kein KI-Hinweis">Kein KI-Hinweis</button><button class="choice" type="button" data-value="Mit KI-Hinweis">Mit KI-Hinweis</button></div></div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Stimulus 1</div><h2>Bitte betrachte diesen Inhalt</h2><p class="muted aiNotice"></p>${treatment(order[0])}</div></section>`);
blocks.push(evalScreen(order[0],0));
blocks.push(`<section class="screen"><div class="card"><div class="pill">Stimulus 2</div><h2>Bitte betrachte diesen Inhalt</h2><p class="muted aiNotice"></p>${treatment(order[1])}</div></section>`);
blocks.push(evalScreen(order[1],1));
blocks.push(`<section class="screen"><div class="card"><div class="pill">Direkter Vergleich</div><h2>Vergleich der beiden Medienarten</h2><div class="qblock"><div class="qtitle">Welcher Inhalt hat dein Vertrauen in die Marke stärker beeinflusst?</div>${choices('compare_trust',['Der Text','Das Bild','Beide etwa gleich stark'])}</div><div class="qblock"><div class="qtitle">Welcher Inhalt ließ die Marke innovativer erscheinen?</div>${choices('compare_innovation',['Der Text','Das Bild','Beide etwa gleich stark'])}</div><div class="qblock"><div class="qtitle">Welcher Inhalt machte die Marke für dich kaufrelevanter?</div>${choices('compare_purchase',['Der Text','Das Bild','Beide etwa gleich stark'])}</div></div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Checks</div><h2>Abschließende Einschätzung</h2>${slider('ai_detected','Ich hatte den Eindruck, dass bei den gezeigten Inhalten künstliche Intelligenz eingesetzt wurde.')}${slider('creation_relevant','Für meine Bewertung war relevant, wie die Inhalte erstellt wurden.')}${slider('category_familiarity','Wie vertraut bist du generell mit der gezeigten Produktkategorie?')}</div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Demografie</div><h2>Angaben zu deiner Person</h2><div class="qblock"><div class="qtitle">Wie alt bist du?</div><input class="field" data-name="age" inputmode="numeric" placeholder="Alter"></div><div class="qblock"><div class="qtitle">Welchem Geschlecht ordnest du dich zu?</div>${choices('gender',['Weiblich','Männlich','Divers','Keine Angabe'])}</div><div class="qblock"><div class="qtitle">Wie häufig nutzt du KI-Anwendungen?</div>${choices('ai_usage',['Nie','Seltener als einmal im Monat','Mehrmals im Monat','Mehrmals pro Woche','Täglich oder fast täglich','Keine Angabe'])}</div></div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Fertig</div><h2>Danke dir!</h2><p>Der Prototyp speichert nichts extern. Unten siehst du nur eine lokale Vorschau der Antworten.</p><pre class="summary" id="summary"></pre></div></section>`);
document.getElementById('screens').innerHTML=blocks.join('');
let i=0;const screens=[...document.querySelectorAll('.screen')],progress=document.getElementById('progress'),stepText=document.getElementById('stepText'),prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');
function update(){screens.forEach((s,n)=>s.classList.toggle('active',n===i));progress.style.width=((i+1)/screens.length*100)+'%';stepText.textContent=`Schritt ${i+1} von ${screens.length}`;prev.disabled=i===0;next.textContent=i===screens.length-1?'Zur Übersicht':'Weiter';document.querySelectorAll('.aiNotice').forEach(e=>e.textContent=aiMode?'Die gezeigten Inhalte wurden mithilfe generativer KI erstellt.':'');if(i===screens.length-1)document.getElementById('summary').textContent=JSON.stringify(answers,null,2);window.scrollTo(0,0)}
document.addEventListener('input',e=>{if(e.target.matches('input[type=range]')){answers[e.target.dataset.name]=e.target.value;document.querySelector(`[data-val="${e.target.dataset.name}"]`).textContent=e.target.value}if(e.target.matches('.field'))answers[e.target.dataset.name]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const group=b.parentElement;group.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[group.dataset.choice]=b.dataset.value;if(group.dataset.choice==='ai_hint'){aiMode=b.dataset.value==='Mit KI-Hinweis';answers.ai_hint=aiMode;update()}});
prev.onclick=()=>{if(i>0){i--;update()}};next.onclick=()=>{if(i===screens.length-1){location.href='index.html';return}i++;update()};update();
</script>
</body>
</html>
