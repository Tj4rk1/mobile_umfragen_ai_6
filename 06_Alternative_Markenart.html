<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alternative Markenart</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--brand:#6b4f2a;--brand2:#f4eadc;--radius:24px;--max:760px}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at top,#fff7ed 0,#f6f7fb 45%,#eef2f7 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}.app{width:min(100%,var(--max));margin:0 auto;min-height:100svh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.88);backdrop-filter:blur(16px);padding:14px clamp(14px,4vw,28px) 10px;border-bottom:1px solid rgba(229,231,235,.8)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.backlink{color:var(--brand);text-decoration:none;font-weight:900;font-size:14px}.steptext{font-size:12px;color:var(--muted);font-weight:800}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--brand);width:0%;transition:.25s}.screen{display:none;padding:clamp(18px,5vw,36px);flex:1}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,5vw,30px);box-shadow:0 18px 50px rgba(15,23,42,.08)}h1{font-size:clamp(30px,8vw,54px);line-height:1.02;letter-spacing:-.05em;margin:0 0 14px}h2{font-size:clamp(23px,6vw,36px);line-height:1.08;letter-spacing:-.04em;margin:0 0 12px}p{font-size:clamp(15px,3.8vw,18px);line-height:1.5;color:#374151}.muted{color:var(--muted)}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--brand2);color:#5b3d18;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}.notice{border:1px solid #fed7aa;background:#fff7ed;color:#7c2d12;border-radius:18px;padding:13px 14px;font-size:14px;line-height:1.45;margin:14px 0}.treatment{border:1px solid var(--line);border-radius:22px;background:#fbfbfc;padding:14px;margin:14px 0 18px}.ad{background:#fff;border-radius:20px;border:1px solid #eceff3;overflow:hidden}.adimg{width:100%;display:block;max-height:45svh;object-fit:cover}.adbody{padding:18px}.brandname{font-size:12px;font-weight:950;color:#6b4f2a;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.headline{font-size:clamp(24px,7vw,38px);line-height:1;letter-spacing:-.04em;font-weight:950;margin-bottom:10px}.copy{color:#4b5563;line-height:1.48;font-size:clamp(15px,3.8vw,17px)}.qblock{margin:18px 0;padding-top:4px}.qtitle{font-weight:850;font-size:clamp(15px,4vw,18px);line-height:1.35;margin-bottom:12px}.scale{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.scale input{width:100%;accent-color:var(--brand)}.value{min-width:38px;height:38px;border-radius:14px;background:#eef2f7;display:grid;place-items:center;font-weight:950}.labels{display:flex;justify-content:space-between;color:#6b7280;font-size:11px;margin-top:4px;gap:10px}.choicegrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px 15px;text-align:left;font-weight:800;color:#1f2937}.choice.selected{border-color:var(--brand);background:#fbf0df;color:#4a3011}.field{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;background:#fff}.nav{position:sticky;bottom:0;background:rgba(246,247,251,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(229,231,235,.9);padding:12px clamp(14px,4vw,28px) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.btn{border:0;border-radius:999px;padding:15px 18px;font-weight:950;font-size:15px}.btn.secondary{background:#e5e7eb;color:#374151}.btn.primary{background:var(--brand);color:#fff;flex:1}.btn:disabled{opacity:.45}.summary{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:18px;padding:16px;font-size:13px;overflow:auto;max-height:42svh}@media(min-width:720px){.choicegrid{grid-template-columns:repeat(2,1fr)}.screen{padding-top:34px}.adbody{padding:24px}.nav{border-radius:24px 24px 0 0}}@media(max-width:370px){.nav{flex-direction:column-reverse}.btn{width:100%}.adimg{max-height:40svh}}
.index-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#155eaa;background:#eef5ff;border:1px solid #bfdbfe;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850;margin-bottom:10px}.index-link:active{transform:translateY(1px)}@media (min-width:760px){.index-link{font-size:14px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="toprow"><a class="backlink" href="index.html">Zur Übersicht</a><div class="steptext" id="stepText"></div></div><div class="bar"><span id="progress"></span></div></header><main id="screens"></main><nav class="nav"><button class="btn secondary" id="prevBtn">Zurück</button><button class="btn primary" id="nextBtn">Weiter</button></nav></div>
<script>
const treatments={
FMCG:{name:'Luma',kind:'FMCG / Alltagsmarke',headline:'Pflege, die einfach in deinen Alltag passt.',copy:'Luma steht für unkomplizierte Hautpflege mit angenehmen Texturen und verständlichen Formulierungen. Für ein frisches Hautgefühl jeden Tag.',image:'aurelis_premium.png'},
Premium:{name:'Aurelis',kind:'Premiummarke',headline:'Mehr Ruhe für deine Haut.',copy:'Aurelis verbindet hochwertige Formulierungen mit einer Pflegeroutine, die sich bewusst und angenehm anfühlt. Für Haut, die gepflegter, ausgeglichener und frischer wirken soll.',image:'aurelis_premium.png'},
Luxus:{name:'Maison Aurelia',kind:'Luxusmarke',headline:'Eine seltene Komposition für anspruchsvolle Haut.',copy:'Maison Aurelia inszeniert Pflege als exklusives Ritual aus ausgewählten Formulierungen, sinnlicher Textur und zurückhaltender Eleganz.',image:'aurelis_premium.png'}};
let brandKey=['FMCG','Premium','Luxus'][Math.floor(Math.random()*3)];let aiMode=false;const brand=treatments[brandKey];const answers={condition:'alternative_markenart',brand_type:brandKey,ai_hint:false};
const labels='<div class="labels"><span>1 Stimme gar nicht zu</span><span>5 Stimme voll zu</span></div>';
const evalItems=[['trust_reliable','Durch die gezeigte Anzeige wirkt diese Marke für mich verlässlich.'],['trust','Durch die gezeigte Anzeige könnte ich mir vorstellen, Vertrauen in diese Marke aufzubauen.'],['trust_promise','Durch die gezeigte Anzeige wirkt es auf mich so, als würde diese Marke halten, was sie verspricht.'],['trust_intentions','Durch die gezeigte Anzeige wirkt es auf mich so, als würde diese Marke die Erwartungen ihrer Kund:innen erfüllen.'],['innovative','Durch die gezeigte Anzeige habe ich das Gefühl, dass diese Marke innovativ ist.'],['creative','Durch die gezeigte Anzeige habe ich das Gefühl, dass diese Marke kreativ ist.'],['modern','Durch die gezeigte Anzeige habe ich das Gefühl, dass diese Marke modern und zukunftsorientiert ist.'],['solutions','Durch die gezeigte Anzeige habe ich das Gefühl, dass diese Marke neue und relevante Lösungen hervorbringen kann.'],['purchase','Durch die gezeigte Anzeige könnte ich mir vorstellen, Produkte dieser Marke zu kaufen.'],['consider','Durch die gezeigte Anzeige ist die Wahrscheinlichkeit hoch, dass ich diese Marke in Betracht ziehen könnte.'],['choose','Durch die gezeigte Anzeige könnte ich diese Marke eher auswählen als vergleichbare Alternativen.'],['positive','Durch die gezeigte Anzeige hinterlässt diese Marke insgesamt einen positiven Eindruck bei mir.'],['fit','Durch die gezeigte Anzeige wirkt die Markenkommunikation für mich passend zu dieser Marke.'],['quality','Durch die gezeigte Anzeige wirkt diese Marke für mich hochwertig.']];
function asset(type){if(type==='Text')return `<div class="ad"><div class="adbody"><div class="brandname">${brand.name} · ${brand.kind}</div><div class="headline">${brand.headline}</div><div class="copy">${brand.copy}</div></div></div>`;return `<div class="ad"><img class="adimg" src="${brand.image}" alt="${brand.name} Treatment"><div class="adbody"><div class="brandname">${brand.name} · ${brand.kind}</div><div class="copy">Bildmotiv der Markenkommunikation.</div></div></div>`}
function treatment(type){return `<div class="treatment"><div class="pill">Treatment sichtbar: ${type}</div>${asset(type)}</div>`}
function slider(name,label){return `<div class="qblock"><div class="qtitle">${label}</div><div class="scale"><input type="range" min="1" max="5" value="3" step="1" data-name="${name}"><div class="value" data-val="${name}">3</div></div>${labels}</div>`}
function choices(name,opts){return `<div class="choicegrid" data-choice="${name}">${opts.map(o=>`<button class="choice" type="button" data-value="${o}">${o}</button>`).join('')}</div>`}
function evalScreen(type,idx){return `<section class="screen"><div class="card"><div class="pill">Bewertung ${idx}</div><h2>${type}-Asset bewerten</h2><p class="muted">Bitte bewerte die folgenden Aussagen spontan nach deinem Eindruck.</p>${treatment(type)}${evalItems.map(([k,l])=>slider(`s${idx}_${type}_${k}`,l)).join('')}</div></section>`}
const blocks=[];
blocks.push(`<section class="screen active"><div class="card"><div class="pill">Alternative Langversion</div><h1>Markenart: FMCG, Premium, Luxus</h1><p>Du siehst zwei Beispiele aus der Markenkommunikation einer fiktiven Marke. Für den Prototyp wird beim Laden eine Markenart simuliert.</p><div class="notice"><strong>Simulierte Markenart:</strong> ${brand.kind}. In der echten Erhebung würde diese Zuweisung zufällig erfolgen.</div><div class="qblock"><div class="qtitle">Prototyp-Bedingung wählen</div><div class="choicegrid" data-choice="ai_hint"><button class="choice selected" type="button" data-value="Kein KI-Hinweis">Kein KI-Hinweis</button><button class="choice" type="button" data-value="Mit KI-Hinweis">Mit KI-Hinweis</button></div></div></div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Stimulus 1</div><h2>Bitte betrachte diesen Inhalt</h2><p class="muted aiNotice"></p>${treatment('Text')}</div></section>`);
blocks.push(evalScreen('Text',1));
blocks.push(`<section class="screen"><div class="card"><div class="pill">Stimulus 2</div><h2>Bitte betrachte diesen Inhalt</h2><p class="muted aiNotice"></p>${treatment('Bild')}</div></section>`);
blocks.push(evalScreen('Bild',2));
blocks.push(`<section class="screen"><div class="card"><div class="pill">Markenart-Check</div><h2>Wie wirkt die Marke auf dich?</h2><div class="qblock"><div class="qtitle">Wie würdest du die gezeigte Marke am ehesten einordnen?</div>${choices('brand_classification',['FMCG- bzw. Alltagsmarke','Premiummarke','Luxusmarke','Keine klare Zuordnung möglich','Weiß nicht'])}</div>${slider('exclusive','Die Marke wirkt exklusiv.')}${slider('everyday','Die Marke wirkt eher alltagsnah als prestigeträchtig.')}</div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">KI-Check</div><h2>Abschließende Einschätzung</h2>${slider('ai_detected','Bei der gezeigten Anzeige hatte ich den Eindruck, dass künstliche Intelligenz eingesetzt wurde.')}${slider('creation_relevant','Für meine Bewertung war relevant, wie die Inhalte erstellt wurden.')}${slider('category_familiarity','Wie vertraut bist du generell mit Marken aus dieser Produktkategorie?')}</div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Demografie</div><h2>Angaben zu deiner Person</h2><div class="qblock"><div class="qtitle">Wie alt bist du?</div>${choices('age',['Unter 18 Jahre','18 bis 24 Jahre','25 bis 34 Jahre','35 bis 44 Jahre','45 bis 54 Jahre','55 bis 64 Jahre','65 Jahre oder älter','Keine Angabe'])}</div><div class="qblock"><div class="qtitle">Welchem Geschlecht ordnest du dich zu?</div>${choices('gender',['Weiblich','Männlich','Divers','Keine Angabe'])}</div><div class="qblock"><div class="qtitle">Wie häufig nutzt du KI-Anwendungen?</div>${choices('ai_usage',['Nie','Seltener als einmal im Monat','Mehrmals im Monat','Mehrmals pro Woche','Täglich oder fast täglich','Keine Angabe'])}</div></div></section>`);
blocks.push(`<section class="screen"><div class="card"><div class="pill">Fertig</div><h2>Danke dir!</h2><p>Der Prototyp speichert nichts extern. Unten siehst du nur eine lokale Vorschau der Antworten.</p><pre class="summary" id="summary"></pre></div></section>`);
document.getElementById('screens').innerHTML=blocks.join('');
let i=0;const screens=[...document.querySelectorAll('.screen')],progress=document.getElementById('progress'),stepText=document.getElementById('stepText'),prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');
function update(){screens.forEach((s,n)=>s.classList.toggle('active',n===i));progress.style.width=((i+1)/screens.length*100)+'%';stepText.textContent=`Schritt ${i+1} von ${screens.length}`;prev.disabled=i===0;next.textContent=i===screens.length-1?'Zur Übersicht':'Weiter';document.querySelectorAll('.aiNotice').forEach(e=>e.textContent=aiMode?'Die gezeigten Inhalte wurden mithilfe generativer KI erstellt.':'');if(i===screens.length-1)document.getElementById('summary').textContent=JSON.stringify(answers,null,2);window.scrollTo(0,0)}
document.addEventListener('input',e=>{if(e.target.matches('input[type=range]')){answers[e.target.dataset.name]=e.target.value;document.querySelector(`[data-val="${e.target.dataset.name}"]`).textContent=e.target.value}if(e.target.matches('.field'))answers[e.target.dataset.name]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b)return;const group=b.parentElement;group.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[group.dataset.choice]=b.dataset.value;if(group.dataset.choice==='ai_hint'){aiMode=b.dataset.value==='Mit KI-Hinweis';answers.ai_hint=aiMode;update()}});
prev.onclick=()=>{if(i>0){i--;update()}};next.onclick=()=>{if(i===screens.length-1){location.href='index.html';return}i++;update()};update();
</script>
</body>
</html>
